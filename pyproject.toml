[project]
name = "lora-appraisal-judge"
version = "0.1.0"
description = "LoRA fine-tuning of a small open model to judge coding-agent closing messages, evaluated against a trajectory-length baseline."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Carlos Herrera Pérez" }]
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Only needed on Kaggle (or any machine with a GPU) to actually run training.py /
# notebooks/kaggle_train.ipynb — deliberately kept out of the base dependencies so
# the rest of the package installs and tests on a laptop with no GPU in seconds.
train = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.29.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
